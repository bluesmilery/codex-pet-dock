[project]
name = "codex-pet-dock"
version = "0.2.0"
description = "Python tooling environment for Codex Pet Dock docs and privacy gates."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
